<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060f"/>
      <stop offset="45%" stop-color="#0b1330"/>
      <stop offset="100%" stop-color="#1a0f2e"/>
    </linearGradient>
    <radialGradient id="planetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planetBody" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4b3f8c"/>
      <stop offset="55%" stop-color="#2a1f5c"/>
      <stop offset="100%" stop-color="#140b30"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd27f" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffd27f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffd27f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="60" cy="40" r="1.5"/>
    <circle cx="140" cy="90" r="1"/>
    <circle cx="220" cy="30" r="1.2"/>
    <circle cx="980" cy="50" r="1.5"/>
    <circle cx="1050" cy="100" r="1"/>
    <circle cx="1120" cy="40" r="1.3"/>
    <circle cx="40" cy="200" r="1"/>
    <circle cx="1160" cy="220" r="1.2"/>
    <circle cx="90" cy="320" r="1"/>
    <circle cx="1100" cy="310" r="1.4"/>
    <circle cx="300" cy="60" r="1"/>
    <circle cx="900" cy="20" r="1"/>
  </g>

  <!-- distant planet, top-right corner, decorative only -->
  <g opacity="0.5">
    <circle cx="1040" cy="70" r="130" fill="url(#planetGlow)"/>
    <circle cx="1040" cy="70" r="60" fill="url(#planetBody)"/>
    <ellipse cx="1040" cy="70" rx="95" ry="16" fill="url(#ring)"/>
  </g>

  <!-- small planet bottom-left, decorative only -->
  <g opacity="0.35">
    <circle cx="120" cy="300" r="70" fill="url(#planetGlow)"/>
    <circle cx="120" cy="300" r="34" fill="url(#planetBody)"/>
  </g>

  <!-- mining laser lines, subtle -->
  <g stroke="#ffd27f" stroke-width="1" opacity="0.18">
    <line x1="1040" y1="130" x2="200" y2="340"/>
    <line x1="1000" y1="10" x2="60" y2="300"/>
  </g>

  <!-- orbit arcs -->
  <g stroke="#7c5cff" stroke-width="1" fill="none" opacity="0.2">
    <ellipse cx="600" cy="180" rx="560" ry="150"/>
    <ellipse cx="600" cy="180" rx="480" ry="120"/>
  </g>

  <text x="600" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="60.0" fill="#ffffff" font-weight="bold">
    <tspan x="600" dy="0">Mine Planet Script</tspan>
  </text>

  <text x="600" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21.0" fill="#c9d1d9">
    <tspan x="600" dy="0">Tired of manually mining each planet — just run this script and go.</tspan>
  </text>
</svg>